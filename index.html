<style>
  @import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap');
  :root {
    /* Paleta IdeasyC "grafito" — derivada del logotipo (monocromo sobre papel cálido). */
    --ink:#1e2225; --slate:#5d666c; --muted:#8d969d;
    --paper:#faf9f7; --surface:#ffffff; --line:#e7e6e2;
    --rail:#f3f2ef; --rail-line:#e4e3de; --rail-hover:#eae9e5; --rail-active:#e0dfd9;
    --rail-ink:#3b4247; --rail-ink-strong:#1e2225; --rail-muted:#7b848b;
    --primary:#23282b; --primary-600:#12161a;
    --accent:#23282b; --accent-soft:#edece8;
    --success:#1d7a55; --success-bg:#e6f4ee;
    --danger:#c0392f; --danger-bg:#fdecea;
    --warn:#8a6116; --warn-bg:#fdf3e0;
    /* Radios y sombras del nuevo sistema */
    --radius:12px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.05), 0 1px 3px rgba(0,0,0,.05);
    --shadow:0 4px 14px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.06);
    --rail-w:252px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:'Jost',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; letter-spacing:-0.006em; }
  input, select, button, textarea { font-family:inherit; }

  /* ============ LOGIN ============ */
  #loginView { min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:var(--rail); color:var(--ink); padding:24px; }
  #loginView img.logo { width:320px; max-width:78vw; margin-bottom:34px; }
  .login-card { width:100%; max-width:380px; background:var(--surface); color:var(--ink);
    border:1px solid var(--line); border-radius:16px; padding:30px 28px; box-shadow:var(--shadow); }
  .login-card h1 { margin:0 0 20px; font-size:15px; font-weight:600; letter-spacing:.4px; }
  .login-card .fld { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .login-card label { font-size:12px; color:var(--slate); font-weight:500;
    letter-spacing:.6px; text-transform:uppercase; }
  .login-card input { font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:10px; padding:11px 13px; }
  .login-card input:focus { outline:none; border-color:var(--primary);
    box-shadow:0 0 0 3px var(--accent-soft); }
  .pass-wrap { position:relative; display:flex; }
  .pass-wrap input { flex:1 1 auto; padding-right:42px; }
  .pass-toggle { position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:transparent; border:0; padding:6px; cursor:pointer; color:var(--muted);
    display:flex; align-items:center; }
  .pass-toggle:hover { color:var(--ink); border-color:transparent; background:transparent; }
  .pass-toggle svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .login-err { color:var(--danger); font-size:13px; min-height:18px; margin:2px 0 10px; }
  .btn-full { width:100%; justify-content:center; padding:12px; }

  #appView { display:none; }
  #appView.on { display:block; }

  /* ============ BARRA LATERAL ============ */
  .sidebar { position:fixed; top:0; left:0; bottom:0; width:var(--rail-w); z-index:60;
    background:var(--surface); color:var(--slate); display:flex; flex-direction:column;
    overflow-y:auto; border-right:1px solid var(--line);
    transform:translateX(-100%); transition:transform .22s ease; }
  #appView.nav-open .sidebar { transform:translateX(0); }
  .backdrop { position:fixed; inset:0; background:rgba(15,22,32,.42); z-index:55;
    opacity:0; visibility:hidden; transition:opacity .2s; }
  #appView.nav-open .backdrop { opacity:1; visibility:visible; }

  /* Marca en texto */
  .sidebar .brand { display:flex; align-items:flex-start; gap:11px; padding:26px 22px 22px; }
  .sidebar .brand .bicon { flex:0 0 auto; width:27px; height:27px; margin-top:2px; color:var(--primary); }
  .sidebar .brand .bicon svg { width:100%; height:100%; fill:none; stroke:currentColor;
    stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .sidebar .brand .bmark { flex:1 1 auto; min-width:0; }
  .sidebar .brand .bw { display:block; font-size:22px; font-weight:600; letter-spacing:-0.2px;
    color:var(--primary); line-height:1.15; }
  .sidebar .brand .btag { display:block; font-size:9.5px; letter-spacing:2px;
    text-transform:uppercase; color:var(--muted); margin-top:5px; font-weight:500; }
  .sidebar .brand .close { margin-left:auto; background:transparent; border:0; color:var(--muted);
    cursor:pointer; padding:4px; display:flex; }
  .sidebar .brand .close:hover { background:transparent; color:var(--ink); }
  .sidebar .brand .close svg { width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7; }

  .sidebar .nav-title { font-size:10px; letter-spacing:1.8px; text-transform:uppercase;
    color:var(--muted); padding:6px 24px 8px; font-weight:500; }
  .sidebar nav { padding-bottom:14px; flex:1 1 auto; }

  .nav-item { display:flex; align-items:center; gap:11px; width:calc(100% - 24px);
    text-align:left; background:transparent; border:0; border-radius:10px;
    margin:2px 12px; padding:10px 12px; font-size:14px; font-weight:500;
    color:var(--slate); cursor:pointer; transition:background .12s, color .12s; }
  .nav-item:hover { background:var(--paper); color:var(--ink); border-color:transparent; }
  .nav-item.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .nav-item svg { width:19px; height:19px; flex:0 0 19px; fill:none;
    stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .nav-label { flex:1 1 auto; }
  .nav-item .chev { width:14px; height:14px; flex:0 0 14px; color:var(--muted); transition:transform .15s; }
  .nav-group.open .nav-grouphead .chev { transform:rotate(90deg); }
  .nav-group.open .nav-grouphead { color:var(--ink); }
  .nav-sub { display:none; }
  .nav-group.open .nav-sub { display:block; }
  .nav-child { padding-left:42px; font-size:13.5px; color:var(--muted); }
  .nav-child:hover { color:var(--ink); }
  .nav-child.active { color:var(--accent); background:var(--accent-soft); }
  .nav-sub .nav-sub .nav-item { padding-left:58px; font-size:13px; }

  /* Pie de la barra */
  .nav-foot { margin-top:auto; border-top:1px solid var(--line); padding:12px; }
  .nav-ver { display:block; font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--muted); font-weight:500; padding:8px 12px 14px; }
  .nav-ver.mismatch { color:var(--danger); letter-spacing:.6px; text-transform:none; line-height:1.35; }
  .login-ver { margin-top:20px; font-size:10.5px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--muted); font-weight:500; }
  .nav-logout { display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:transparent; border:0; border-radius:10px; padding:10px 12px;
    font-size:14px; font-weight:500; color:var(--slate); cursor:pointer; transition:background .12s, color .12s; }
  .nav-logout:hover { background:var(--danger-bg); color:var(--danger); border-color:transparent; }
  .nav-logout svg { width:19px; height:19px; flex:0 0 19px; fill:none; stroke:currentColor;
    stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }

  /* ============ ESTRUCTURA ============ */
  .main { min-height:100vh; display:flex; flex-direction:column; }

  .topbar { background:transparent; border:0; box-shadow:none;
    padding:18px 24px; display:flex; align-items:center; gap:13px; }
  .hamburger { display:flex; align-items:center; justify-content:center; background:var(--surface);
    border:1px solid var(--line); border-radius:10px; width:38px; height:38px; padding:0;
    cursor:pointer; color:var(--ink); }
  .hamburger:hover { border-color:#d4d3cc; }
  .hamburger svg { width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; }
  .topbar .userbox { margin-left:auto; display:flex; align-items:center; gap:10px; }
  .topbar .avatar { width:34px; height:34px; border-radius:50%; flex:0 0 34px;
    background:var(--accent-soft); color:var(--accent); display:flex; align-items:center;
    justify-content:center; font-size:14px; font-weight:600; text-transform:uppercase; }
  .topbar .hello { font-size:14px; color:var(--ink); font-weight:500; }
  .topbar .logout { background:transparent; color:var(--slate); border:0;
    padding:6px 10px; border-radius:9px; font-size:13px; font-weight:500; cursor:pointer; }
  .topbar .logout:hover { background:var(--paper); color:var(--ink); border-color:transparent; }

  .content { padding:8px 24px 40px; width:100%; }

  /* Encabezado de página */
  .page-head { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between;
    gap:16px; margin:6px 0 26px; }
  .page-head .ph-l { min-width:0; }
  .page-title { margin:0; font-size:42px; line-height:1.1; font-weight:600;
    letter-spacing:-0.5px; color:var(--ink); }
  .page-sub { margin:8px 0 0; font-size:14px; color:var(--muted); }
  .page-actions { display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .btn-add { display:inline-flex; align-items:center; gap:7px; }
  .btn-add svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }

  @media (min-width:900px) {
    .sidebar { transform:none; transition:none; }
    .sidebar .brand .close { display:none; }
    .main { margin-left:var(--rail-w); }
    .hamburger { display:none; }
    .backdrop { display:none; }
  }
  @media (max-width:899px) {
    .page-title { font-size:32px; }
  }
  @media (max-width:520px) {
    .sidebar { width:82vw; max-width:290px; }
    .content { padding:4px 16px 32px; }
    .topbar { padding:14px 16px; }
    .topbar .hello { display:none; }
    .page-title { font-size:30px; }
  }

  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 14px; }

  /* ============ FILTROS ============ */
  .filterbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:12px; position:relative; }
  .chip { display:inline-flex; align-items:center; gap:8px; background:var(--surface);
    border:1px solid var(--line); border-radius:999px; padding:5px 10px 5px 13px;
    font-size:13px; color:var(--ink); box-shadow:var(--shadow-sm); }
  .chip b { font-weight:600; }
  .chip .x { cursor:pointer; color:var(--muted); font-weight:600; line-height:1; padding:0 2px; }
  .chip .x:hover { color:var(--danger); }
  .nofilters { font-size:13px; color:var(--muted); }
  .dl-menu { position:absolute; top:100%; left:0; z-index:50; margin-top:6px; min-width:190px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:6px; display:flex; flex-direction:column; gap:2px; }
  .dl-menu button { width:100%; text-align:left; border:none; background:transparent; padding:9px 11px;
    border-radius:8px; font:inherit; font-size:13px; font-weight:500; cursor:pointer; color:var(--ink); }
  .dl-menu button:hover { background:var(--paper); border-color:transparent; }

  .filter-pop { position:absolute; top:100%; left:0; z-index:40; width:340px; max-width:92vw;
    margin-top:6px; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:16px; box-sizing:border-box; }
  .filter-pop h4 { margin:0 0 8px; font-size:11px; color:var(--muted); font-weight:600;
    letter-spacing:.8px; text-transform:uppercase; }
  .filter-pop select, .filter-pop input { width:100%; font:inherit; border:1px solid var(--line);
    border-radius:10px; padding:8px 10px; margin-bottom:8px; box-sizing:border-box;
    background:var(--surface); color:var(--ink); }
  .filter-values { max-height:200px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; padding:4px; margin-bottom:10px; }
  .filter-values label { display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:1.35;
    padding:6px 8px; cursor:pointer; border-radius:8px; text-align:left; }
  .filter-values label:hover { background:var(--paper); }
  .filter-values input[type=checkbox] { flex:0 0 auto; width:15px; height:15px; margin:1px 0 0; accent-color:var(--primary); }
  .filter-values label span { flex:1 1 auto; min-width:0; word-break:break-word; }
  .fv-tools { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .fv-tools input { margin-bottom:0; }
  .fv-tools button { padding:6px 10px; font-size:12px; white-space:nowrap; }
  .fv-empty { font-size:13px; color:var(--muted); padding:8px; }
  .filter-range { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .filter-range input { margin-bottom:0; min-width:0; flex:1 1 0; }
  .filter-range span { flex:0 0 auto; color:var(--muted); }
  .filter-actions { display:flex; gap:8px; justify-content:flex-end; }
  .filter-actions button { padding:7px 13px; font-size:13px; }

  /* ============ TARJETAS DE RESUMEN ============ */
  .summary { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
  .sum-card.accent { background:var(--primary); border-color:var(--primary); }
  .sum-card.accent .k { color:rgba(255,255,255,.62); }
  .sum-card.accent .v { color:#fff; }
  .sum-card .sub { font-size:11.5px; color:var(--muted); margin-top:3px; }
  .sum-card.accent .sub { color:rgba(255,255,255,.62); }
  .sum-card .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px;
    vertical-align:middle; }
  .sum-card { background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow-sm); padding:16px 20px; min-width:160px; text-align:center; }
  .sum-card .k { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:500; }
  .sum-card .v { font-size:26px; font-weight:600; letter-spacing:-0.5px; margin-top:4px; font-variant-numeric:tabular-nums; }

  /* ============ INICIO ============ */
  #homeView { display:none; }
  .hero { margin-bottom:28px; }
  .hero h2 { margin:0; font-size:42px; line-height:1.1; font-weight:600; letter-spacing:-0.5px; }
  .hero p { margin:8px 0 0; color:var(--muted); font-size:14px; }
  @media (max-width:899px) { .hero h2 { font-size:32px; } }

  .quick-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:30px; }
  .quick-card { display:flex; align-items:center; gap:13px; background:var(--surface);
    border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-sm);
    padding:18px; cursor:pointer; text-align:left; font:inherit; color:var(--ink);
    transition:box-shadow .15s, transform .15s; }
  .quick-card:hover { box-shadow:var(--shadow); transform:translateY(-2px); border-color:var(--line); }
  .quick-card svg { width:21px; height:21px; flex:0 0 21px; fill:none; stroke:currentColor;
    stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; color:var(--accent); }
  .quick-card > span { display:block; min-width:0; }
  .quick-card .qt { display:block; font-size:14px; font-weight:600; }
  .quick-card .qs { display:block; font-size:12px; color:var(--muted); margin-top:2px; }

  .alert-list { display:flex; flex-direction:column; gap:10px; }
  .alert { display:flex; align-items:center; gap:16px; background:var(--surface);
    border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-sm); padding:16px 20px; }
  .alert .an { font-size:24px; font-weight:600; min-width:54px; font-variant-numeric:tabular-nums; color:var(--slate); }
  .alert.warn .an { color:var(--warn); }
  .alert.info .an { color:var(--accent); }
  .alert .ab { display:block; flex:1 1 auto; min-width:0; }
  .alert .at { display:block; font-size:14px; font-weight:600; }
  .alert .ad { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
  .alert .an { display:block; }
  .alert button { padding:7px 13px; font-size:13px; white-space:nowrap; }
  .all-good { background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow-sm); padding:26px; text-align:center; color:var(--muted); font-size:14px; }

  /* ============ DASHBOARD ============ */
  #dashView { display:none; }
  /* Importador de estados de cuenta */
  #impView { display:none; }
  .drop { border:2px dashed var(--rail-line); border-radius:var(--radius); background:var(--surface);
    padding:38px 24px; text-align:center; cursor:pointer; transition:border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color:var(--accent); background:var(--accent-soft); }
  .drop .dt { font-size:15px; font-weight:500; }
  .drop .ds { font-size:13px; color:var(--slate); margin-top:6px; }
  .drop svg { width:30px; height:30px; fill:none; stroke:var(--accent); stroke-width:1.6;
    stroke-linecap:round; stroke-linejoin:round; margin-bottom:10px; }
  .imp-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow-sm); margin-top:16px; overflow:hidden; }
  .imp-card > h4 { margin:0; padding:14px 18px; border-bottom:1px solid var(--line);
    font-size:14px; font-weight:600; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .imp-card > h4 .per { font-weight:400; color:var(--slate); }
  .imp-body { padding:16px 18px; }
  .imp-grid { display:grid; gap:10px 22px; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); }
  .imp-grid div { display:flex; justify-content:space-between; gap:10px; font-size:13.5px;
    padding:5px 0; border-bottom:1px solid var(--line); }
  .imp-grid div span:first-child { color:var(--slate); }
  .imp-grid div span:last-child { font-variant-numeric:tabular-nums; font-weight:500; }
  .imp-aviso { background:var(--warn-bg); color:var(--warn); border-radius:9px;
    padding:9px 12px; font-size:13px; margin-top:12px; }
  .imp-err { background:var(--danger-bg); color:var(--danger); border-radius:9px;
    padding:9px 12px; font-size:13px; }
  .imp-ok { background:var(--success-bg); color:var(--success); border-radius:9px;
    padding:9px 12px; font-size:13px; margin-top:12px; }
  .imp-tag { font-size:11px; letter-spacing:.4px; text-transform:uppercase; border-radius:999px;
    padding:3px 9px; font-weight:500; }
  .imp-tag.ok { background:var(--success-bg); color:var(--success); }
  .imp-tag.dup { background:var(--warn-bg); color:var(--warn); }
  .imp-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:20px; }
  /* Pestañas por fuente de ingreso */
  .line-tabs { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 18px; }
  .line-tabs button { padding:9px 15px; font-size:13.5px; border-radius:999px; }
  .line-tabs button.on { background:var(--primary); border-color:var(--primary);
    color:#fff; font-weight:500; }
  .line-tabs button.on:hover { background:var(--primary-600); border-color:var(--primary-600); color:#fff; }
  .line-tabs button .n { opacity:.55; margin-left:6px; font-size:12px; }
  /* Tarjetas comparativas de línea de negocio */
  .line-grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
  .line-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 17px; box-shadow:var(--shadow-sm); }
  .line-card .lname { font-size:12px; letter-spacing:.5px; text-transform:uppercase;
    color:var(--muted); font-weight:500; }
  .line-card .lval { font-size:22px; font-weight:600; margin:6px 0 2px; letter-spacing:-.4px; }
  .line-card .lsub { font-size:12.5px; color:var(--slate); }
  .line-card .lshare { margin-top:10px; height:6px; border-radius:999px; background:var(--accent-soft); }
  .line-card .lshare span { display:block; height:100%; border-radius:999px; background:var(--accent); }
  .line-card .lpc { font-size:12px; color:var(--warn); margin-top:8px; }
  .dash-bar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:24px; }
  .dash-bar .lb { font-size:12px; color:var(--muted); font-weight:500; letter-spacing:.5px; text-transform:uppercase; }
  .dash-bar input[type=date] { font:inherit; border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; background:var(--surface); color:var(--ink); }
  .dash-bar .quick { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
  .dash-bar .quick button { padding:7px 12px; font-size:13px; }
  .dash-bar .quick button.on { background:var(--accent-soft); color:var(--accent);
    border-color:transparent; font-weight:600; }
  .dash-section { margin-bottom:30px; }
  .dash-section > h3 { margin:0 0 14px; font-size:11px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:1.2px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow-sm); padding:20px 22px; min-width:0; }
  .kpi .k { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:500; }
  .kpi .v { font-size:34px; font-weight:600; letter-spacing:-0.8px; margin-top:6px; line-height:1.1;
    font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kpi .s { font-size:12px; color:var(--muted); margin-top:4px; }
  .kpi.dark { background:var(--primary); border-color:var(--primary); }
  .kpi.dark .k { color:rgba(255,255,255,.72); }
  .kpi.dark .v { color:#fff; }
  .kpi.dark .s { color:rgba(255,255,255,.72); }

  .dash-filter { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:24px; }
  .dash-filter label { font-size:12px; font-weight:500; color:var(--muted); letter-spacing:.5px; text-transform:uppercase; }
  .dash-filter input[type=date] { font:inherit; border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; background:var(--surface); color:var(--ink); }
  .dash-filter span { color:var(--muted); }
  .dash-filter button { padding:8px 14px; font-size:13px; }
  .dash-filter .dash-hint { font-size:12px; color:var(--muted); margin-left:4px; }

  .dash-cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:18px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow-sm); overflow:hidden; }
  .panel > h4 { margin:0; padding:16px 20px; border-bottom:1px solid var(--line);
    font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  .panel-body { padding:20px; }

  .bars { display:flex; flex-direction:column; gap:11px; }
  .bar-row { display:grid; grid-template-columns:130px 1fr auto; align-items:center; gap:10px; font-size:13px; }
  .bar-row .lbl { color:var(--slate); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar-track { background:var(--paper); border-radius:999px; height:8px; overflow:hidden; display:block; width:100%; }
  .bar-fill { background:var(--accent); height:8px; border-radius:999px; display:block; }
  .bar-row .val { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; min-width:64px; text-align:right; }

  .chart { display:flex; align-items:flex-end; gap:6px; height:170px; padding-top:8px; }
  .chart .cbar { flex:1 1 0; display:flex; flex-direction:column; justify-content:flex-end;
    align-items:center; gap:6px; min-width:0; max-width:96px; }
  .chart .cbar .fill { width:100%; background:var(--accent); border-radius:6px 6px 0 0; min-height:2px;
    transition:background .12s; }
  .chart .cbar .cl { font-size:10px; color:var(--muted); white-space:nowrap; }
  .chart .cbar .cv { font-size:9px; color:var(--slate); font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .chart .cbar:hover .fill { background:var(--primary-600); }
  .bar-total { display:flex; justify-content:space-between; align-items:center; gap:10px;
    border-top:1px solid var(--line); margin-top:14px; padding-top:12px;
    font-size:13px; font-weight:600; }
  .bar-total .tv { font-variant-numeric:tabular-nums; }

  .mini-table { width:100%; border-collapse:collapse; font-size:13px; table-layout:auto; }
  .mini-table th, .mini-table td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:200px; width:auto; }
  .mini-table th { color:var(--muted); font-weight:600; font-size:10px; text-transform:uppercase;
    letter-spacing:.8px; background:transparent; position:static; text-align:left; }
  .mini-table td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .dash-empty { color:var(--muted); font-size:13px; padding:8px 0; }

  /* ============ CONTROLES ============ */
  input[type=text], input[type=search] { font:inherit; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:10px; padding:9px 12px; }
  input:focus, select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--accent-soft); }
  .count { margin-left:auto; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }

  button { font:inherit; font-weight:500; cursor:pointer; border-radius:10px;
    border:1px solid var(--line); background:var(--surface); color:var(--slate);
    padding:9px 15px; transition:background .12s, border-color .12s, color .12s; }
  button:hover { border-color:#d4d3cc; color:var(--ink); }
  button.primary { background:var(--primary); border-color:var(--primary); color:#fff; font-weight:500; }
  button.primary:hover { background:var(--primary-600); border-color:var(--primary-600); color:#fff; }
  button:disabled { opacity:.55; cursor:default; }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow-sm); overflow:hidden; }
  .card + .card { margin-top:22px; }
  .card-head { padding:16px 20px; border-bottom:1px solid var(--line);
    font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
  .card-body { padding:20px; }

  /* ============ TABLA ============ */
  .table-scroll { overflow-x:auto; scrollbar-width:thin; scrollbar-color:#cdccc4 var(--paper); -webkit-overflow-scrolling:touch; }
  .table-scroll::-webkit-scrollbar { height:11px; }
  .table-scroll::-webkit-scrollbar-track { background:var(--paper); }
  .table-scroll::-webkit-scrollbar-thumb { background:#cdccc4; border-radius:6px; border:2px solid var(--paper); }
  .table-scroll::-webkit-scrollbar-thumb:hover { background:#aab6c4; }
  table { border-collapse:collapse; font-size:14px; table-layout:fixed; width:auto; }
  th, td { text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
    width:220px; box-sizing:border-box; overflow:hidden; text-overflow:ellipsis; }
  th { color:var(--muted); font-weight:600; background:var(--paper); position:sticky; top:0;
    text-align:center !important; font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { color:var(--ink); }
  .ta-center { text-align:center; }
  .ta-center input { text-align:center; }
  .ta-right { text-align:right; font-variant-numeric:tabular-nums; }
  /* Celdas de dinero: la cifra manda, el signo de pesos se hace a un lado */
  .money { font-variant-numeric:tabular-nums; font-weight:500; letter-spacing:-.1px; }
  .money .cur { color:var(--muted); font-weight:400; margin-right:1px; }
  .money.big { font-weight:600; }
  .money.due { color:var(--danger); font-weight:600; }
  .money.zero { color:var(--muted); font-weight:400; }
  /* Cliente con su inicial, para reconocerlo de un vistazo */
  .who { display:inline-flex; align-items:center; gap:9px; min-width:0; }
  .who i { flex:0 0 24px; width:24px; height:24px; border-radius:50%; font-style:normal;
    display:inline-flex; align-items:center; justify-content:center; font-size:11px;
    font-weight:600; letter-spacing:.2px; }
  .who span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Barra de cobranza dentro de la tabla */
  .cobro { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
  .cobro .bar { flex:0 0 34px; height:5px; border-radius:999px; background:var(--accent-soft); overflow:hidden; }
  .cobro .bar i { display:block; height:100%; background:var(--success); }
  .ta-right input { text-align:right; }
  tbody tr:hover { background:var(--paper); }
  td.actions { white-space:nowrap; }
  .row-input { font:inherit; width:100%; min-width:110px; border:1px solid var(--line); border-radius:8px; padding:7px 9px;
    background:var(--surface); color:var(--ink); }
  .edit-btn, .save-btn, .cancel-btn { padding:6px 11px; font-size:13px; }
  .cancel-btn { margin-left:6px; }

  /* Pastillas de valor en tablas */
  .tag { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px;
    font-weight:500; line-height:1.5; max-width:100%; overflow:hidden;
    text-overflow:ellipsis; vertical-align:middle; }
  .tag-ok   { background:var(--success-bg); color:var(--success); }
  .tag-bad  { background:var(--danger-bg);  color:var(--danger); }
  .tag-warn { background:var(--warn-bg);    color:var(--warn); }

  /* ============ FORMULARIO / MODAL ============ */
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:16px; }
  .form-grid .fld { display:flex; flex-direction:column; gap:6px; }
  .form-grid label { font-size:11px; color:var(--muted); font-weight:600;
    letter-spacing:.7px; text-transform:uppercase; }
  .form-grid input, .form-grid select { font:inherit; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; background:var(--surface); color:var(--ink); width:100%; }
  .form-grid input[readonly] { background:var(--paper); color:var(--slate); border-color:var(--line); cursor:default; }
  .form-grid input[readonly]:focus { box-shadow:none; border-color:var(--line); }
  .form-actions { margin-top:16px; display:flex; gap:10px; align-items:center; }

  .modal-overlay { position:fixed; inset:0; z-index:80; background:rgba(15,22,32,.45);
    display:none; align-items:flex-start; justify-content:center; padding:32px 20px;
    overflow-y:auto; }
  .modal-overlay.on { display:flex; }
  .modal { background:var(--surface); border-radius:16px; box-shadow:var(--shadow);
    width:100%; max-width:900px; margin:auto; display:flex; flex-direction:column;
    max-height:calc(100vh - 64px); }
  .modal-head { display:flex; align-items:center; gap:12px; padding:20px 24px;
    border-bottom:1px solid var(--line); }
  .modal-head h3 { margin:0; font-size:19px; font-weight:600; letter-spacing:-0.2px; }
  .modal-x { margin-left:auto; background:transparent; border:0; color:var(--muted);
    cursor:pointer; padding:6px; display:flex; border-radius:8px; }
  .modal-x:hover { background:var(--paper); color:var(--ink); border-color:transparent; }
  .modal-x svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; }
  .modal-body { padding:24px; overflow-y:auto; flex:1 1 auto; }
  .modal-foot { display:flex; gap:10px; justify-content:flex-end; align-items:center;
    padding:16px 24px; border-top:1px solid var(--line); }
  @media (max-width:520px) {
    .modal-overlay { padding:0; }
    .modal { border-radius:0; max-height:100vh; min-height:100vh; }
  }

  .state { padding:32px 16px; text-align:center; color:var(--muted); font-size:14px; }

  .toast { position:fixed; right:20px; bottom:20px; max-width:340px;
    padding:13px 17px; border-radius:12px; font-size:14px; font-weight:500;
    box-shadow:var(--shadow); opacity:0; transform:translateY(8px);
    transition:opacity .18s, transform .18s; pointer-events:none; z-index:90; }
  .toast.show { opacity:1; transform:translateY(0); }
  .toast.ok  { background:var(--success-bg); color:var(--success); border:1px solid #bfe6d5; }
  .toast.err { background:var(--danger-bg);  color:var(--danger);  border:1px solid #f0c9c9; }
</style>
</head>

  // Llama a una función serverless en /api/*
  async function api(path, body) {
    const res = await fetch('/api/' + path, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    });
    const data = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
    return data;
  }

  function doLogin() {
    var u = document.getElementById('user').value.trim();

    if (!u || !p) { err.textContent = 'Completá usuario y contraseña.'; return; }

        state.token = res.token;
        state.rol = String(res.rol || '').trim().toLowerCase();
        document.getElementById('hello').textContent = 'Hola, ' + (res.nombre || u);

  // Versión de este archivo. Debe coincidir con la de lib/core.js: si no coincide,
  // el despliegue quedó a medias (index.html nuevo con API vieja, o al revés).
  var VERSION = '2026.08.24-006';

  function revisarVersion(delServidor) {
    var el = document.getElementById('navVer');
    if (!el) return;
    if (!delServidor) { el.textContent = 'Versión ' + VERSION; return; }
    if (delServidor === VERSION) {
      el.className = 'nav-ver';
      el.textContent = 'Versión ' + VERSION;
    } else {
      el.className = 'nav-ver mismatch';
      el.textContent = 'Despliegue mezclado: pantalla ' + VERSION + ', servidor ' + delServidor +
                       '. Vuelve a subir el proyecto completo.';
    }
  }

  function buildMenu() {
    api('menu', { token: state.token }).then(function (res) {
      revisarVersion(res.version);
      var nav = document.getElementById('navMenu'); nav.innerHTML = '';

      // Construye el menú a cualquier profundidad.
      // Un ítem puede ser área (clickeable) y grupo (desplegable) a la vez.
      function build(items, container, depth) {
        items.forEach(function (m) {
          LABELS[m.key] = m.label;
          var hasKids = m.children && m.children.length;
          if (hasKids) {
            var g = document.createElement('div'); g.className = 'nav-group';
            var head = document.createElement('button');
            head.className = 'nav-item nav-grouphead' + (depth > 0 ? ' nav-child' : '');
            head.innerHTML = (depth === 0 ? icon(m.icon) : '') +
                             '<span class="nav-label">' + m.label + '</span>' + chev();
            head.setAttribute('data-key', m.key);
            var sub = document.createElement('div'); sub.className = 'nav-sub';
            build(m.children, sub, depth + 1);
            head.addEventListener('click', function (e) {
              var chevEl = head.querySelector('.chev');
              var onChev = chevEl && chevEl.contains(e.target);
              // Si el grupo también es un área, al tocar el texto se abre el área.
              if (m.isArea && !onChev) { selectArea(m.key, m.label); g.classList.add('open'); }
              else g.classList.toggle('open');
            });
            g.appendChild(head); g.appendChild(sub); container.appendChild(g);
          } else {
            var b = document.createElement('button');
            b.className = 'nav-item' + (depth > 0 ? ' nav-child' : '');
            b.innerHTML = (depth === 0 ? icon(m.icon) : '') +
                          '<span class="nav-label">' + m.label + '</span>';
            b.setAttribute('data-key', m.key);
            b.addEventListener('click', function () { selectArea(m.key, m.label); });
            container.appendChild(b);
          }
        });
      }
      build(res.items || [], nav, 0);

      if (res.defaultKey) selectArea(res.defaultKey, res.defaultLabel, true);
    }).catch(fail);
  }

  function selectArea(key, label, keepClosed) {
    state.key = key; state.label = label;

  function loadArea() {
    document.getElementById('tableWrap').innerHTML = '<div class="state">Cargando...</div>';
    document.getElementById('count').textContent = '';
    state.categories = {}; state.lookup = null;
    Promise.all([
      api('data', { token: state.token, key: state.key }),
      api('categories', { token: state.token, key: state.key }).catch(function () { return {}; }),
      api('lookup', { token: state.token, key: state.key }).catch(function () { return null; })
    ]).then(function (r) {
      var data = r[0]; state.categories = r[1] || {};
      var lk = r[2]; state.lookup = (lk && lk.options && lk.options.length) ? lk : null;
      state.headers = data.headers || []; state.rows = data.rows || [];
      if (!data.connected) {
        document.getElementById('tableWrap').innerHTML =
          '<div class="state">Esta área todavía no está conectada. Agregá su hoja en SHEETS (lib/core.js).</div>';
        showAddButton(false);
        document.getElementById('formFields').innerHTML = '';
      } else if (!state.headers.length) {
        document.getElementById('tableWrap').innerHTML =
          '<div class="state">La hoja está vacía o no tiene encabezados en la fila 1.</div>';
        showAddButton(false);
        document.getElementById('formFields').innerHTML = '';
      } else {
        if (pendingAutoFilter) { pendingAutoFilter = false; aplicarFiltroAnual(); }
        showAddButton(!esSoloLectura(state.key));
        renderFilterBar();
        renderTable();
        if (!esSoloLectura(state.key)) renderForm();
      }
    }).catch(fail);
  }

  var sortState = { col: null, dir: 1 };
  function parseNumber(v) {
    var s = String(v == null ? '' : v).trim();
    if (s === '') return null;
    s = s.replace(/[^0-9.,\-]/g, '').replace(/,/g, '');
    if (s === '' || s === '-' || s === '.') return null;
    var n = parseFloat(s);
    return isNaN(n) ? null : n;
  }

  // Columnas que se muestran como dinero ($ y separador de miles). Se comparan sin distinguir espacios/mayúsculas.
  var MONEY_FIELDS = ['Descuento','Subtotal','IVA','Total','Cobrado','Total Cobrado','Por Cobrar','Saldo','Monto','Importe','Precio',
                      'Rendimiento','Comisión','Retención','Capital','Interés','Intereses',
                      'Salario Bruto Mensual','Salario Neto Mensual','SD','SDI','SBC',
                      'Cuentas por Cobrar','Cuentas por Pagar','Ingreso','Egreso','Cargo','Abono','Depósito','Retiro',
                      'Valor est.','Valor est','Valor estimado'];
  // Columnas de dinero que NO se suman en las tarjetas (solo se formatean)
  var NO_SUM_FIELDS = ['SD','SDI','SBC'];
  function isSummable(h) {
    return isMoneyCol(h) && !NO_SUM_FIELDS.some(function (n) { return norm(n) === norm(h); });
  }
  // Ancho máximo especial por columna (px). Las demás usan 220px (regla th,td).
  var WIDTH_FIELDS = { 'comentarios': 440, 'status': 120, 'no. identificacion': 120, 'no. de identificacion': 120,
                       'fecha': 150, 'codigo': 150, 'expediente': 150, 'fecha de contrato': 150,
                       'monto': 150, 'fecha de nacimiento': 150, 'unidades': 120 };
  function colWidth(h) { return WIDTH_FIELDS[norm(h)] || null; }
  // Columnas que se muestran centradas (por nombre; tolera espacios/acentos/mayúsculas).
  var CENTER_FIELDS = ['Status', 'No. Identificación', 'No. de Identificación', 'Fecha',
                       'RFC', 'Código Postal', 'Banco', 'Dias de Crédito', 'Días de Crédito',
                       'Código', 'Expediente', 'Fecha de contrato', 'Monto', 'Fecha de nacimiento',
                       'Tipo de contrato', 'Unidades', 'N.º de activo', 'No. de activo',
                       'No. de Contrato', 'Factura',
                       'Oportunidad', 'Teléfono', 'Teléfono 2', 'Etapa', 'Propietario de la relación'];
  function isCenterCol(h) {
    var s = norm(h);
    return CENTER_FIELDS.some(function (c) { return norm(c) === s; });
  }
  function isMoneyCol(h) {
    var s = norm(h);
    return MONEY_FIELDS.some(function (m) { return norm(m) === s; });
  }
  function formatMoney(v) {
    var n = parseNumber(v);
    if (n === null) return String(v == null ? '' : v);
    var neg = n < 0; n = Math.abs(n);
    var parts = n.toFixed(2).split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + '$' + parts[0] + '.' + parts[1];
  }
  var MESES = { enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12,
    ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,set:9,oct:10,nov:11,dic:12 };
  function parseDate(v) {
    var s = String(v == null ? '' : v).trim().toLowerCase();
    if (s === '') return null;
    var m;
    m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
    if (m) return (+m[1]) * 10000 + (+m[2]) * 100 + (+m[3]);
    m = s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
    if (m) return (+m[3]) * 10000 + (+m[2]) * 100 + (+m[1]);
    m = s.match(/^(\d{1,2})\s+(?:de\s+)?([a-záéíóú]+)\.?\s+(?:de\s+)?(\d{4})$/);
    if (m && MESES[m[2]]) return (+m[3]) * 10000 + MESES[m[2]] * 100 + (+m[1]);
    return null;
  }
  function cellKind(v) {
    var s = String(v == null ? '' : v).trim();
    if (s === '') return 'empty';
    if (parseDate(s) !== null) return 'date';
    if (parseNumber(s) !== null && !/[a-z]{2,}/i.test(s)) return 'number';
    return 'text';
  }
  function columnType(h) {
    var d = 0, n = 0, total = 0, lim = Math.min(state.rows.length, 60);
    for (var i = 0; i < lim; i++) {
      var k = cellKind(state.rows[i][h]);
      if (k === 'empty') continue;
      total++;
      if (k === 'date') d++; else if (k === 'number') n++;
    }
    if (total === 0) return 'text';
    if (d / total >= 0.6) return 'date';
    if (n / total >= 0.7) return 'number';
    return 'text';
  }
  function sortRows(rows) {
    if (sortState.col === null) return rows;
    var h = sortState.col, dir = sortState.dir, type = columnType(h);
    return rows.slice().sort(function (a, b) {
      var va = a[h], vb = b[h];
      var ea = (va == null || String(va).trim() === ''), eb = (vb == null || String(vb).trim() === '');
      if (ea && eb) return 0; if (ea) return 1; if (eb) return -1;
      var cmp;
      if (type === 'number') cmp = (parseNumber(va) || 0) - (parseNumber(vb) || 0);
      else if (type === 'date') cmp = (parseDate(va) || 0) - (parseDate(vb) || 0);
      else cmp = String(va).localeCompare(String(vb), 'es', { numeric: true, sensitivity: 'base' });
      return cmp * dir;
    });
  }

  // ===== Filtros =====
  var filters = [];   // {col, type:'values'|'range', values:[], from:'', to:''}

  // Áreas que arrancan con filtro de fecha del año en curso (columna a usar).
  var AUTO_DATE_FILTER = {
    ventas_registro: 'Fecha',
    rrhh_incidencias: 'Fecha',
    ingresos: 'Fecha',
    egresos: 'Fecha'
  };
  var pendingAutoFilter = false;
  function aplicarFiltroAnual() {
    var nombre = AUTO_DATE_FILTER[state.key];
    if (!nombre) return;
    var col = state.headers.filter(function (x) { return norm(x) === norm(nombre); })[0];
    if (!col) {
      // Respaldo: primera columna que parezca de fecha
      col = state.headers.filter(function (x) { return norm(x).indexOf('fecha') === 0; })[0];
    }
    if (!col) return;
    filters.push({ col: col, type: 'range', from: isoInicioAnio(), to: isoHoy() });
  }

  // Columnas filtrables por área. Si un área no está aquí, se pueden filtrar todas.
  var FILTER_FIELDS = {
    ventas_leads: ['Oportunidad', 'Etapa', 'Propietario de la relación'],
    cli_contratos: ['Tipo de contrato', 'Status'],
    cli_directorio: ['Status', 'Tipo de cliente'],
    compras_proveedores: ['Status', 'Categoría', 'Régimen fiscal', 'Términos de pago'],
    rrhh_incidencias: ['Fecha', 'Colaborador', 'Puesto', 'Área', 'Departamento', 'Inicdencia', 'Incidencia'],
    rrhh_colaboradores: ['Status', 'Sexo', 'Fecha de Inicio de Rel Laboral', 'Fecha de baja',
                         'Tipo de empleado', 'Régimen de pago', 'Periodicidad de pago',
                         'Tipo de Contrato', 'Puesto', 'Área', 'Departamento']
  };
  function filterableHeaders() {
    var allow = FILTER_FIELDS[state.key];
    if (allow === undefined) return state.headers;   // no configurada: todas
    if (!allow.length) return [];                     // configurada sin filtros: ninguna
    return state.headers.filter(function (h) {
      return allow.some(function (a) { return norm(a) === norm(h); });
    });
  }

  function dateColumns() {
    return state.headers.filter(function (h) { return columnType(h) === 'date'; });
  }
  function distinctValues(col) {
    var seen = {}, out = [];
    state.rows.forEach(function (r) {
      var v = String(r[col] == null ? '' : r[col]).trim();
      if (v && !seen[v]) { seen[v] = 1; out.push(v); }
    });
    out.sort(function (a, b) { return a.localeCompare(b, 'es', { numeric: true }); });
    return out;
  }
  function passesFilters(r) {
    return filters.every(function (f) {
      var v = r[f.col];
      if (f.type === 'values') {
        return f.values.indexOf(String(v == null ? '' : v).trim()) !== -1;
      }
      var d = parseDate(v);
      if (d === null) return false;
      if (f.from) { var df = parseInt(f.from.replace(/-/g, ''), 10); if (d < df) return false; }
      if (f.to)   { var dt = parseInt(f.to.replace(/-/g, ''), 10);   if (d > dt) return false; }
      return true;
    });
  }
  function renderFilterBar() {
    var bar = document.getElementById('filterBar');
    var canFilter = filterableHeaders().length > 0;
    document.getElementById('filterBtn').style.display = canFilter ? '' : 'none';
    if (!canFilter) { bar.innerHTML = ''; return; }
    if (!filters.length) { bar.innerHTML = '<span class="nofilters">No hay filtros seleccionados</span>'; return; }
    var html = '';
    filters.forEach(function (f, i) {
      var desc = (f.type === 'values')
        ? (f.values.length > 2 ? f.values.length + ' seleccionados' : f.values.join(', '))
        : ((f.from ? isoToLargo(f.from) : '…') + ' → ' + (f.to ? isoToLargo(f.to) : '…'));
      html += '<span class="chip"><b>' + esc(String(f.col).trim()) + ':</b> ' + esc(desc) +
              '<span class="x" data-i="' + i + '">×</span></span>';
    });
    html += '<button id="clearFiltersBtn" type="button" style="padding:5px 10px;font-size:13px">Quitar todos</button>';
    bar.innerHTML = html;
  }
  function openFilterPopup() {
    var bar = document.getElementById('filterBar');
    if (document.getElementById('filterPop')) { closeFilterPopup(); return; }
    var cols = filterableHeaders();
    if (!cols.length) { toast('No hay columnas filtrables en esta área.', 'err'); return; }
    var pop = document.createElement('div');
    pop.className = 'filter-pop'; pop.id = 'filterPop';
    var opts = cols.map(function (h) {
      return '<option value="' + esc(h).replace(/"/g, '&quot;') + '">' + esc(String(h).trim()) + '</option>';
    }).join('');
    pop.innerHTML = '<h4>Filtrar por columna</h4>' +
      '<select id="fCol">' + opts + '</select>' +
      '<div id="fBody"></div>' +
      '<div class="filter-actions"><button id="fCancel" type="button">Cancelar</button>' +
      '<button class="primary" id="fApply" type="button">Aplicar</button></div>';
    bar.appendChild(pop);
    document.getElementById('fCol').addEventListener('change', renderFilterBody);
    document.getElementById('fCancel').addEventListener('click', closeFilterPopup);
    document.getElementById('fApply').addEventListener('click', applyFilterFromPopup);
    renderFilterBody();
  }

  // ===== Resumen =====

  // Columna que se desglosa en tarjetas de conteo (una por cada valor). Por área.

  // Áreas donde el desglose suma un monto (columna de valor) en vez de contar filas.

  // Áreas de ingreso: la tarjetería se arma con el dinero, no con el conteo.
  var AREAS_INGRESO = ['ventas_registro','ventas_consultoria','ventas_inversiones',
                       'ventas_prestamos','ventas_puerto','cxc'];
  function esAreaIngreso(k) { return AREAS_INGRESO.indexOf(k) !== -1; }
  function breakdownCol() {

    return state.headers.filter(function (h) { return norm(h) === norm(name); })[0];

  function renderSummary(rows) {
    var box = document.getElementById('summary');
    if (!state.headers.length) { box.innerHTML = ''; return; }

    // --- Áreas de ingreso: subtotal, cobrado, por cobrar y desglose por fuente ---
    if (esAreaIngreso(state.key)) {
      var cSub = colBy('Subtotal') || colBy('Total');
      var cTot = colBy('Total'), cCob = colBy('Cobrado'), cPC = colBy('Cuentas por Cobrar');
      var cLin = colBy('Línea de Negocio');
      var sub = 0, cob = 0, pc = 0;
      rows.forEach(function (r) {
        sub += parseNumber(r[cSub]) || 0;
        cob += parseNumber(r[cCob]) || 0;
        pc  += parseNumber(r[cPC]) || 0;
      });
      var conIva = 0;
      rows.forEach(function (r) { conIva += parseNumber(r[cTot]) || 0; });
      var avance = conIva > 0 ? (cob / conIva * 100) : 0;

      var hh = '<div class="sum-card accent"><div class="k">Ingresos sin IVA</div><div class="v">' +
        esc(formatMoney(sub)) + '</div><div class="sub">' +
        rows.length.toLocaleString('es-MX') + (rows.length === 1 ? ' registro' : ' registros') +
        '</div></div>';
      hh += '<div class="sum-card"><div class="k">Con IVA</div><div class="v">' +
        esc(formatMoney(conIva)) + '</div></div>';
      hh += '<div class="sum-card"><div class="k">Cobrado</div><div class="v">' +
        esc(formatMoney(cob)) + '</div><div class="sub">' + avance.toFixed(0) +
        '% de lo facturado</div></div>';
      if (pc > 0) {
        hh += '<div class="sum-card"><div class="k">Por cobrar</div><div class="v" style="color:var(--danger)">' +
          esc(formatMoney(pc)) + '</div></div>';
      }
      // Una tarjeta por fuente, solo cuando hay más de una a la vista
      if (cLin) {
        var porL = {}, ordenL = [];
        rows.forEach(function (r) {
          var k = String(r[cLin] == null ? '' : r[cLin]).trim();
          if (!k) return;
          if (porL[k] === undefined) { porL[k] = 0; ordenL.push(k); }
          porL[k] += parseNumber(r[cSub]) || 0;
        });
        if (ordenL.length > 1) {
          ordenL.sort(function (a, b) { return porL[b] - porL[a]; });
          ordenL.forEach(function (k) {
            var t = TONO_LINEA[norm(k)] || CHIP_TONES[chipHash(norm(k))];
            hh += '<div class="sum-card"><div class="k"><span class="dot" style="background:' +
              t.fg + '"></span>' + esc(k) + '</div><div class="v">' + esc(formatMoney(porL[k])) +
              '</div><div class="sub">' + (sub > 0 ? Math.round(porL[k] / sub * 100) : 0) +
              '% del total</div></div>';
          });
        }
      }
      box.innerHTML = hh;
      return;
    }

    var html = '<div class="sum-card"><div class="k">Registros</div><div class="v">' +
               rows.length.toLocaleString('es-MX') + '</div></div>';

    // Desglose monetario (p. ej. Leads: Valor est. por Etapa)
    var bm = BREAKDOWN_MONEY[state.key];
    if (bm) {
      var byCol = colBy(bm.by), sumCol = colBy(bm.sum);
      if (byCol && sumCol) {
        var montos = {}, orderM = [];
        rows.forEach(function (r) {
          var k = String(r[byCol] == null ? '' : r[byCol]).trim();
          if (!k) return;
          var n = parseNumber(r[sumCol]);
          if (montos[k] === undefined) { montos[k] = 0; orderM.push(k); }
          if (n !== null) montos[k] += n;
        });
        orderM.sort(function (a, b) { return montos[b] - montos[a]; });
        orderM.forEach(function (k) {
          html += '<div class="sum-card"><div class="k">' + esc(k) + '</div><div class="v">' +
                  esc(formatMoney(montos[k])) + '</div></div>';
        });
      }
      box.innerHTML = html;
      return;   // en estas áreas, el desglose monetario reemplaza el resto
    }

    // Una tarjeta por cada valor presente en la columna de desglose
    var bCol = breakdownCol();
    if (bCol) {
      var counts = {}, order = [];
      rows.forEach(function (r) {
        var v = String(r[bCol] == null ? '' : r[bCol]).trim();
        if (!v) return;
        if (counts[v] === undefined) { counts[v] = 0; order.push(v); }
        counts[v]++;
      });
      order.sort(function (a, b) { return counts[b] - counts[a]; }); // del más frecuente al menos
      order.forEach(function (v) {
        html += '<div class="sum-card"><div class="k">' + esc(v) + '</div><div class="v">' +
                counts[v].toLocaleString('es-MX') + '</div></div>';
      });
    }

    // Las sumas de dinero consideran solo los activos (si hay columna Status)
    var statusCol = state.headers.filter(function (h) { return norm(h) === 'status'; })[0];
    var sumRows = rows, soloActivos = false;
    if (statusCol) {
      var activos = rows.filter(function (r) {
        var v = norm(r[statusCol]);
        return v === 'activo' || v === 'activa';
      });
      if (activos.length) { sumRows = activos; soloActivos = true; }
    }

    state.headers.forEach(function (h) {
      if (!isSummable(h) || excluidaDeResumen(h)) return;
      var sum = 0, any = false;
      sumRows.forEach(function (r) {
        var n = parseNumber(r[h]); if (n !== null) { sum += n; any = true; }
      });
      if (!any) return;
      var titulo = esc(String(h).trim()) + (soloActivos ? ' (activos)' : '');
      html += '<div class="sum-card"><div class="k">' + titulo +
              '</div><div class="v">' + esc(formatMoney(sum)) + '</div></div>';
    });
    box.innerHTML = html;
  }

  var MESES_NOM = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  // Convierte 'AAAA-MM-DD' (del selector) a '15 enero 2026'
  function largoToIso(v) {
    // Convierte "14 julio 2026", "2026-07-14" o "14/07/2026" a AAAA-MM-DD
    var s = String(v == null ? '' : v).trim();
    if (!s) return '';
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return m[3] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
    var meses = { enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12 };
    m = s.toLowerCase().match(/^(\d{1,2})\s+(?:de\s+)?([a-záéíóú]+)\.?\s+(?:de\s+)?(\d{4})$/);
    if (m && meses[m[2]]) return m[3] + '-' + String(meses[m[2]]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
    return '';
  }
  function isoToLargo(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return iso;
    return parseInt(m[3], 10) + ' ' + MESES_NOM[parseInt(m[2], 10) - 1] + ' ' + m[1];
  }
  // Muestra en la tabla cualquier fecha reconocible como '15 enero 2026'
  function formatDateCell(v) {
    var d = parseDate(v);
    if (d === null) return String(v == null ? '' : v);
    var y = Math.floor(d / 10000), mo = Math.floor((d % 10000) / 100), da = d % 100;
    if (mo < 1 || mo > 12) return String(v);
    return da + ' ' + MESES_NOM[mo - 1] + ' ' + y;
  }

  // ===================== DASHBOARD =====================
  var MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  var dashData = null;                       // datos crudos del servidor
  function isoHoy() {

           '-' + String(d.getDate()).padStart(2, '0');

  function isoInicioAnio() { return new Date().getFullYear() + '-01-01'; }
  // Arranca filtrado del 1 de enero del año en curso a hoy
  var dashRange = { from: isoInicioAnio(), to: isoHoy() };

  function fmtNum(n) { return (n || 0).toLocaleString('es-MX'); }
  function fmtMoneyShort(n) {
    n = n || 0;
    var neg = n < 0, a = Math.abs(n);

  function isoNum(s) { return s ? parseInt(String(s).replace(/-/g, ''), 10) : null; }
  function enRango(d) {

    var f = isoNum(dashRange.from), t = isoNum(dashRange.to);

  }
  function topN(obj, n) {
    return Object.keys(obj || {})

      .sort(function (a, b) { return b.v - a.v; })
      .slice(0, n || 6);

  function barsHTML(obj, opts) {

    Object.keys(obj || {}).forEach(function (k) { granTotal += obj[k] || 0; });
    var max = items[0].v || 1;
    var html = '<div class="bars">';
    items.forEach(function (it) {

  function chartHTML(porMes, opts) {

    keys.forEach(function (k) { if (porMes[k] > max) max = porMes[k]; });
    var granTotal = 0;
    keys.forEach(function (k) { granTotal += porMes[k] || 0; });
    var html = '<div class="chart">';
    keys.forEach(function (k) {
      var v = porMes[k] || 0;

      var tip = lbl + ': ' + (opts.money ? formatMoney(v) : fmtNum(v));

      html += '<div class="cbar" title="' + esc(tip) + '">' +
              '<span class="cv">' + esc(vlbl) + '</span>' +

            esc(opts.money ? formatMoney(granTotal) : fmtNum(granTotal)) + '</span></div>';

  function agrupar(rows, campo) {

  }
  function agruparSuma(rows, campoClave, campoValor) {
    var o = {};
    rows.forEach(function (r) {
      var k = r[campoClave]; var n = r[campoValor];
      if (!k || n === null || n === undefined) return;
      o[k] = (o[k] || 0) + n;
    });
    return o;
  }
  function porMesSuma(rows, campoValor) {
    var o = {};
    rows.forEach(function (r) {
      if (!r.d) return;
      var k = String(r.d).slice(0, 4) + '-' + String(r.d).slice(4, 6);
      var n = campoValor ? r[campoValor] : 1;
      if (n === null || n === undefined) return;
      o[k] = (o[k] || 0) + n;
    });
    return o;
  }
  function suma(rows, campo) {
    var t = 0;
    rows.forEach(function (r) { var n = r[campo]; if (n !== null && n !== undefined) t += n; });
    return t;
  }

  var dashLinea = '';   // '' = todas las fuentes de ingreso

  // Suma el campo pedido, cayendo a Total si no hay Subtotal en la hoja.
  function ingreso(r) { return (r.sb !== null && r.sb !== undefined) ? r.sb : (r.t || 0); }
  function sumaIngreso(rows) {
    var t = 0; rows.forEach(function (r) { t += ingreso(r) || 0; }); return t;
  }
  function agruparIngreso(rows, campo) {
    var o = {};
    rows.forEach(function (r) {
      var k = r[campo]; if (!k) return;
      o[k] = (o[k] || 0) + (ingreso(r) || 0);
    });
    return o;
  }
  function porMesIngreso(rows) {
    var o = {};
    rows.forEach(function (r) {
      if (!r.d) return;
      var k = String(r.d).slice(0, 4) + '-' + String(r.d).slice(4, 6);
      o[k] = (o[k] || 0) + (ingreso(r) || 0);
    });
    return o;
  }

  function fMoney(n) {

  function conectarImportador() {
    var drop = document.getElementById('impDrop');
    var file = document.getElementById('impFile');
    if (!drop) return;
    drop.addEventListener('click', function () { file.click(); });
    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) { tomarArchivos(e.dataTransfer.files); });
    file.addEventListener('change', function () { tomarArchivos(file.files); });

    var leer = document.getElementById('impLeer');
    if (leer) leer.addEventListener('click', function () { enviarImportacion(false); });
    var limpiar = document.getElementById('impLimpiar');
    if (limpiar) limpiar.addEventListener('click', function () {
      impArchivos = []; impResultado = null; renderImportador();
    });
    var guardar = document.getElementById('impGuardar');
    if (guardar) guardar.addEventListener('click', function () {
      var fz = document.getElementById('impForzar');
      enviarImportacion(true, fz && fz.checked);
    });
    var cancelar = document.getElementById('impCancelar');
    if (cancelar) cancelar.addEventListener('click', function () {
      impResultado = null; renderImportador();
    });
  }

  function tomarArchivos(lista) {
    var arr = Array.prototype.slice.call(lista || []).filter(function (f) {
      return /\.pdf$/i.test(f.name) || f.type === 'application/pdf';
    });
    if (!arr.length) { toast('Solo se aceptan archivos PDF.', true); return; }
    if (arr.length > 6) { toast('Máximo 6 archivos a la vez.', true); arr = arr.slice(0, 6); }
    var pendientes = arr.length;
    impArchivos = [];
    arr.forEach(function (f) {
      var fr = new FileReader();
      fr.onload = function () {
        impArchivos.push({ nombre: f.name, base64: String(fr.result).split(',')[1] });
        if (--pendientes === 0) { impResultado = null; renderImportador(); }
      };
      fr.onerror = function () {
        if (--pendientes === 0) renderImportador();
        toast('No pude leer ' + f.name, true);
      };
      fr.readAsDataURL(f);
    });
  }

  function enviarImportacion(confirmar, forzar) {
    var v = document.getElementById('impView');
    var btn = document.getElementById(confirmar ? 'impGuardar' : 'impLeer');
    if (btn) { btn.disabled = true; btn.textContent = confirmar ? 'Guardando…' : 'Leyendo…'; }
    api('importar', {
      token: state.token, archivos: impArchivos,
      confirmar: !!confirmar, forzar: !!forzar
    }).then(function (res) {
      impResultado = res;
      if (res.ok) { impArchivos = []; toast('Estados de cuenta guardados.'); }
      renderImportador();
      v.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }).catch(function (e) {
      renderImportador(); fail(e);
    });
  }

  function loadDashboard() {
    document.getElementById('dashView').innerHTML =
      '<div class="state" style="padding:60px 0">Cargando indicadores…</div>';
    api('dashboard', { token: state.token })
      .then(function (d) { dashData = d; renderDashboard(); })
      .catch(function (e) {
        document.getElementById('dashView').innerHTML =
          '<div class="state" style="padding:60px 0">No se pudieron cargar los indicadores.</div>';
        fail(e);
      });
  }
