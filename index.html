  var CHIP_TONES = [
    { bg:'#e8f0f9', fg:'#26598f' }, { bg:'#eaf1ec', fg:'#2f6a4f' },
    { bg:'#f1eef7', fg:'#5b4a86' }, { bg:'#fdf1e7', fg:'#8a5a24' },
    { bg:'#e9f2f4', fg:'#2b6470' }, { bg:'#f4eef1', fg:'#7d3f5b' },
    { bg:'#eef1e9', fg:'#57682f' }, { bg:'#edeef2', fg:'#4a5468' }
  ];
  function isChipCol(h) {
    var n = norm(h);
    if (categoryFor(h)) return true;                       // está en la pestaña CATEGORIAS
    return CHIP_COLS.some(function (c) { return norm(c) === n; });
  }
  function chipClassFor(v) {
    var n = norm(v);
    if (CHIP_OK.indexOf(n) !== -1) return 'tag tag-ok';
    if (CHIP_BAD.indexOf(n) !== -1) return 'tag tag-bad';
    if (CHIP_WARN.indexOf(n) !== -1) return 'tag tag-warn';
    return null;
  }
  function chipHash(str) {
    var h = 0, s = String(str);
    for (var i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
    return Math.abs(h) % CHIP_TONES.length;
  }
  function chipHtml(v) {
    var txt = String(v == null ? '' : v).trim();
    if (!txt) return '';
    var fijo = TONO_LINEA[norm(txt)];
    if (fijo) return '<span class="tag" style="background:' + fijo.bg + ';color:' + fijo.fg + '">' +
                     esc(txt) + '</span>';
    var cls = chipClassFor(txt);
    if (cls) return '<span class="' + cls + '">' + esc(txt) + '</span>';
    var t = CHIP_TONES[chipHash(norm(txt))];
    return '<span class="tag" style="background:' + t.bg + ';color:' + t.fg + '">' + esc(txt) + '</span>';
  }

  // Nombre con su inicial en un círculo del mismo tono estable que las pastillas.
  function quienHtml(v) {
    var txt = String(v == null ? '' : v).trim();
    if (!txt) return '';
    var t = CHIP_TONES[chipHash(norm(txt))];
    var ini = txt.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g, '').trim().charAt(0).toUpperCase() || '·';
    return '<span class="who"><i style="background:' + t.bg + ';color:' + t.fg + '">' + esc(ini) +
           '</i><span>' + esc(txt) + '</span></span>';
  }
  function esColumnaNombre(hh) {
    var n = norm(hh);
    return n === 'cliente' || n === 'proveedor' || n === 'colaborador' || n === 'nombre';
  }
  function esColumnaPorCobrar(hh) {
    var n = norm(hh);
    return n === 'cuentas por cobrar' || n === 'por cobrar' || n === 'saldo pendiente';
  }
  // El monto con el signo de pesos atenuado, para que la cifra se lea primero.
  function dineroHtml(raw, extra) {
    var n = parseNumber(raw);
    if (n === null) return '';
    var txt = formatMoney(n);
    var cur = txt.charAt(0) === '$' ? '$' : '';
    var resto = cur ? txt.slice(1) : txt;
    return '<span class="money' + (extra ? ' ' + extra : '') + '"><span class="cur">' + cur +
           '</span>' + esc(resto) + '</span>';
  }

  function renderTable() {
    var rows = sortRows(filteredRows());
    renderSummary(rows);
    document.getElementById('count').textContent = rows.length + (rows.length === 1 ? ' registro' : ' registros');
    if (!rows.length) { document.getElementById('tableWrap').innerHTML = '<div class="state">Sin registros.</div>'; return; }
    var cols = visibleHeaders();
    var conAcciones = !esSoloLectura(state.key);
    var totalW = conAcciones ? 220 : 0; // columna de Acciones
    cols.forEach(function (h) { totalW += (colWidth(h) || 220); });
    var html = '<table style="width:' + totalW + 'px"><thead><tr>';
    cols.forEach(function (h) {
      var arrow = (sortState.col === h) ? (sortState.dir === 1 ? ' ▲' : ' ▼') : '';
      var cc = isMoneyCol(h) ? ' ta-right' : (isCenterCol(h) ? ' ta-center' : '');
      var ht = esc(String(h).trim());
      var w = colWidth(h); var ws = w ? ' style="width:' + w + 'px"' : '';
      html += '<th class="sortable' + cc + '"' + ws + ' data-col="' + esc(h).replace(/"/g, '&quot;') + '" title="' + ht.replace(/"/g, '&quot;') + '">' + ht + arrow + '</th>';
    });
    html += (conAcciones ? '<th>Acciones</th>' : '') + '</tr></thead><tbody>';
    rows.forEach(function (r) {
      var editing = (r._row === editingRow);
      html += '<tr>';
      cols.forEach(function (h) {
        var cls = isMoneyCol(h) ? ' class="ta-right"' : (isCenterCol(h) ? ' class="ta-center"' : '');
        var w = colWidth(h); var ws = w ? ' style="width:' + w + 'px"' : '';
        if (editing) {
          var rawVal = (r[h] == null) ? '' : String(r[h]);
          var cat = isReadonlyField(h) ? null : categoryFor(h);
          if (cat) {
            // Desplegable con las opciones de CATEGORIAS
            var selHtml = '<select class="row-input" data-col="' + esc(h) + '">';
            selHtml += '<option value="">— elegir —</option>';
            var yaEsta = false;
            cat.options.forEach(function (op) {
              var sel = (norm(op) === norm(rawVal)) ? ' selected' : '';
              if (sel) yaEsta = true;
              selHtml += '<option' + sel + '>' + esc(op) + '</option>';
            });
            // Si el valor actual no está en la lista, lo conservamos como opción
            if (!yaEsta && rawVal) selHtml += '<option selected>' + esc(rawVal) + '</option>';
            selHtml += '<option value="__add__">➕ Agregar nueva…</option></select>';
            html += '<td' + cls + ws + '>' + selHtml + '</td>';
          } else if (isDateCol(h)) {
            html += '<td' + cls + ws + '><input type="date" class="row-input" data-col="' + esc(h) +
                    '" value="' + esc(largoToIso(rawVal)) + '"></td>';
          } else {
            html += '<td' + cls + ws + '><input class="row-input" data-col="' + esc(h) + '" value="' +
                    esc(rawVal).replace(/"/g, '&quot;') + '"></td>';
          }
        } else {
          var raw = r[h];
          var shown = isMoneyCol(h) ? formatMoney(raw)
                    : (isDateCol(h) ? formatDateCell(raw) : (raw == null ? '' : raw));
          var e = esc(shown);
          var cellHtml;
          if (isMoneyCol(h)) {
            var nv = parseNumber(raw);
            if (esColumnaPorCobrar(h)) {
              // Lo que falta por cobrar salta a la vista; lo saldado se apaga.
              if (nv === null || nv === 0) {
                cellHtml = '<span class="tag tag-ok">Pagado</span>';
              } else {
                var tot = parseNumber(r[colBy('Total')]) || 0;
                var pagado = tot > 0 ? Math.max(0, Math.min(100, (1 - nv / tot) * 100)) : 0;
                cellHtml = '<span class="cobro"><span class="bar"><i style="width:' +
                           pagado.toFixed(0) + '%"></i></span>' + dineroHtml(nv, 'due') + '</span>';
              }
            } else {
              cellHtml = dineroHtml(raw, (norm(h) === 'total' ? 'big' : '') +
                                         (nv === 0 ? ' zero' : ''));
            }
          } else if (isDateCol(h)) {
            cellHtml = e;
          } else if (esColumnaNombre(h)) {
            cellHtml = quienHtml(shown);
          } else if (isChipCol(h)) {
            cellHtml = chipHtml(shown);
          } else {
            cellHtml = e;
          }
          html += '<td' + cls + ws + ' title="' + e.replace(/"/g, '&quot;') + '">' + cellHtml + '</td>';
        }
      });
      if (!conAcciones) {
        // sin columna de acciones
      } else if (editing) {
        html += '<td class="actions"><button class="save-btn primary" data-row="' + r._row + '">Guardar</button>' +
                '<button class="cancel-btn" data-row="' + r._row + '">Cancelar</button></td>';
      } else {
        html += '<td class="actions"><button class="edit-btn" data-row="' + r._row + '">Editar</button></td>';
      }
      html += '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('tableWrap').innerHTML = html;
  }

  function saveEdit(rowNum, btn) {
    var tr = btn.closest('tr');
    var inputs = tr.querySelectorAll('.row-input');
    var record = {};
    // Parte de los valores originales para no borrar las columnas ocultas
    var orig = state.rows.filter(function (r) { return r._row === rowNum; })[0] || {};
    state.headers.forEach(function (h) { record[h] = (orig[h] != null) ? orig[h] : ''; });
    inputs.forEach(function (i) {
      var colName = i.getAttribute('data-col');
      var v = (i.value || '').trim();
      if (v === '__add__') v = '';
      if (v && i.type === 'date') v = isoToLargo(v);              // 2026-07-14 → 14 julio 2026
      else if (v && isMoneyCol(colName)) { var n = parseNumber(v); if (n !== null) v = String(n); }
      record[colName] = v;
    });
    btn.disabled = true; btn.textContent = 'Guardando...';
    api('update', { token: state.token, key: state.key, row: rowNum, record: record })
      .then(function () { toast('Cambios guardados.', 'ok'); editingRow = -1; loadArea(); })
      .catch(function (e) { fail(e); btn.disabled = false; btn.textContent = 'Guardar'; });
  }

  // Campos visibles en "Agregar registro" por área (en orden).
  // Un área que no esté acá muestra todas sus columnas.
  var FORM_FIELDS = {
    ventas_registro: ['Fecha','Cliente','Tipo de Servicio','Descripción','No. de Contrato','Vendedor',
             'Descuento','Subtotal','IVA','Total','Total Cobrado','Por Cobrar','Observaciones']
  };
  // Campos que NO se muestran en "Agregar registro" (el resto sí). Por área.
  var EXCLUDE_FIELDS = {
    cli_contratos: ['Expediente', 'Contrato'],
    rrhh_colaboradores: ['Edad', 'Fecha de baja', 'Antigüedad', 'Contrato', 'Expediente'],
    rrhh_incidencias: ['Mes']
  };
  // Campos que se muestran solo como referencia (no editables, no se guardan: los calcula la hoja).
  var READONLY_FIELDS = {
    inv_activos: ['Categoría'],
    rrhh_incidencias: ['Puesto', 'Área', 'Departamento'],
    rrhh_colaboradores: ['Área', 'Departamento']
  };
  function isReadonlyField(h) {
    return (READONLY_FIELDS[state.key] || []).some(function (r) { return norm(r) === norm(h); });
  }
  function norm(s) { return String(s).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
  function categoryFor(name) {
    var key = norm(name);
    var found = Object.keys(state.categories || {}).filter(function (k) { return norm(k) === key; })[0];
    return found ? { key: found, options: state.categories[found] } : null;
  }
  function onSelectChange(sel, name) {
    if (sel.value !== '__add__') return;
    var val = window.prompt('Nueva opción para "' + String(name).trim() + '":');
    sel.value = '';
    if (!val || !val.trim()) return;
    val = val.trim();
    sel.disabled = true;
    api('categories', { token: state.token, key: state.key, add: true, categoria: String(name).trim(), valor: val })
      .then(function () {
        var cat = categoryFor(name);
        var k = cat ? cat.key : String(name).trim();
        if (!state.categories[k]) state.categories[k] = [];
        state.categories[k].push(val);
        var addOpt = sel.querySelector('option[value="__add__"]');
        var o = document.createElement('option'); o.textContent = val;
        sel.insertBefore(o, addOpt);
        sel.value = val;
        toast('Opción agregada.', 'ok');
      })
      .catch(fail)
      .then(function () { sel.disabled = false; });
  }
  // Campos obligatorios por área (por nombre; tolera espacios/acentos/mayúsculas).
  var REQUIRED_FIELDS = {
    // Los nombres deben coincidir con los encabezados reales de cada hoja.
    // Si un nombre no existe en la hoja, simplemente se ignora.
    ventas_registro: ['Fecha', 'Cliente', 'Tipo de Servicio', 'Subtotal', 'IVA', 'Total'],
    cli_contratos: ['No. de Contrato', 'Fecha de contrato', 'Cliente', 'Tipo de contrato']
    // cli_directorio, compras_proveedores y rrhh_colaboradores: sin obligatorios
    // hasta confirmar los encabezados reales de esas hojas.
  };
  // Campos que se autocompletan con el siguiente número disponible (editables).
  // Cálculo automático: al capturar la base se llenan IVA y Total. Por área.
  var AUTO_CALC = {
    ventas_registro: { base: 'Subtotal', tasa: 0.16, iva: 'IVA', total: 'Total' }
  };
  function campoForm(nombre) {
    var els = document.querySelectorAll('#formFields [data-col]');
    for (var i = 0; i < els.length; i++) {
      if (norm(els[i].getAttribute('data-col')) === norm(nombre)) return els[i];
    }
    return null;
  }
  function recalcularTotales() {
    var cfg = AUTO_CALC[state.key];
    if (!cfg) return;
    var elBase = campoForm(cfg.base), elIva = campoForm(cfg.iva), elTotal = campoForm(cfg.total);
    if (!elBase || !elIva || !elTotal) return;
    var sub = parseNumber(elBase.value);
    if (sub === null) { elIva.value = ''; elTotal.value = ''; return; }
    var total = Math.round(sub * (1 + cfg.tasa) * 100) / 100;
    var iva = Math.round((total - sub) * 100) / 100;   // así Subtotal + IVA = Total exacto
    elTotal.value = formatMoney(total);
    elIva.value = formatMoney(iva);
  }

  var AUTONUM_FIELDS = ['No. Identificación', 'No. de Identificación'];
  function findHeaderByName(name) {
    var key = norm(name);
    return state.headers.filter(function (h) { return norm(h) === key; })[0];
  }
  function isRequiredField(h) {
    return (REQUIRED_FIELDS[state.key] || []).some(function (r) { return norm(r) === norm(h); })
           && state.headers.some(function (x) { return norm(x) === norm(h); });
  }
  function isAutoNumField(h) {
    return AUTONUM_FIELDS.some(function (a) { return norm(a) === norm(h); });
  }
  function nextAvailableId(h) {
    var used = {};
    state.rows.forEach(function (r) {
      var v = parseInt(String(r[h] == null ? '' : r[h]).trim(), 10);
      if (!isNaN(v) && v > 0) used[v] = true;
    });
    var n = 1; while (used[n]) n++; return String(n);
  }
  function isLookupKeyField(h) {
    return !!(state.lookup && norm(state.lookup.keyField) === norm(h));
  }
  function applyLookup(value) {
    if (!state.lookup) return;
    var rec = state.lookup.map[value] || {};
    state.lookup.fills.forEach(function (f) {
      var real = findHeaderByName(f);
      if (!real) return;
      var el = document.querySelector('#formFields [data-col="' + real + '"]');
      if (el) el.value = rec[f] || '';
    });
  }
  function renderForm() {
    var box = document.getElementById('formFields'); box.innerHTML = '';
    var allow = FORM_FIELDS[state.key];
    var fields;
    if (allow && allow.length) {
      fields = [];
      allow.forEach(function (name) {
        // Busca el encabezado real tolerando espacios de más / mayúsculas
        var actual = state.headers.filter(function (h) {
          return String(h).trim().toLowerCase() === String(name).trim().toLowerCase();
        })[0];
        if (actual !== undefined) fields.push(actual);
      });
    } else {
      var excl = EXCLUDE_FIELDS[state.key] || [];
      fields = state.headers.filter(function (h) {
        return !excl.some(function (e) { return norm(e) === norm(h); });
      });
    }
    fields.forEach(function (h) {
      var wrap = document.createElement('div'); wrap.className = 'fld';
      var lab = document.createElement('label');
      lab.innerHTML = esc(String(h).trim()) + (isRequiredField(h) ? ' <span style="color:var(--danger)">*</span>' : '');
      wrap.appendChild(lab);
      var cat = isReadonlyField(h) ? null : categoryFor(h);  // solo lectura gana sobre desplegable
      if (isLookupKeyField(h)) {
        var lsel = document.createElement('select'); lsel.setAttribute('data-col', h);
        var lhtml = '<option value="">— elegir —</option>';
        state.lookup.options.forEach(function (o) { lhtml += '<option>' + esc(o) + '</option>'; });
        lsel.innerHTML = lhtml;
        lsel.addEventListener('change', function () { applyLookup(lsel.value); });
        wrap.appendChild(lsel);
      } else if (cat) {
        var sel = document.createElement('select'); sel.setAttribute('data-col', h);
        var html = '<option value="">— elegir —</option>';
        (cat.options || []).forEach(function (o) { html += '<option>' + esc(o) + '</option>'; });
        html += '<option value="__add__">➕ Agregar nueva…</option>';
        sel.innerHTML = html;
        sel.addEventListener('change', function () {
          onSelectChange(sel, h);
          if (isLookupKeyField(h)) applyLookup(sel.value);
        });
        wrap.appendChild(sel);
      } else {
        var inp = document.createElement('input');
        inp.type = isDateCol(h) ? 'date' : 'text';
        if (isReadonlyField(h)) {
          inp.type = 'text';
          inp.readOnly = true;
          inp.tabIndex = -1;
        }
        inp.setAttribute('data-col', h);   // se envía; el backend ignora las columnas con fórmula
        if (isAutoNumField(h)) inp.value = nextAvailableId(h);
        if (isMoneyCol(h) && !isReadonlyField(h)) {
          inp.setAttribute('inputmode', 'decimal');
          var cfgAC = AUTO_CALC[state.key];
          var esBase = !!(cfgAC && norm(h) === norm(cfgAC.base));
          // Al salir: mostrar formateado. Al entrar: mostrar el número crudo para editar.
          inp.addEventListener('blur', function () {
            var n = parseNumber(inp.value);
            inp.value = (n === null) ? '' : formatMoney(n);
            if (esBase) recalcularTotales();
          });
          inp.addEventListener('focus', function () {
            var n = parseNumber(inp.value);
            inp.value = (n === null) ? '' : String(n);
          });
          if (esBase) inp.addEventListener('input', recalcularTotales);
        }
        wrap.appendChild(inp);
      }
      box.appendChild(wrap);
    });
  }

  function save() {
    var record = {}; var els = document.querySelectorAll('#formFields [data-col]'); var has = false;
    els.forEach(function (i) {
      var v = (i.value || '').trim();
      if (v === '__add__') v = '';
      if (v && i.type === 'date') v = isoToLargo(v);   // 2026-07-14 → 14 julio 2026
      var colName = i.getAttribute('data-col');
      if (v && isMoneyCol(colName)) { var n = parseNumber(v); if (n !== null) v = String(n); }
      record[colName] = v;
      if (v) has = true;
    });
    if (!has) { toast('Completá al menos un campo.', 'err'); return; }
    var reqs = REQUIRED_FIELDS[state.key] || [];
    for (var ri = 0; ri < reqs.length; ri++) {
      var rh = findHeaderByName(reqs[ri]);
      if (!rh) continue;   // la columna no existe en esta hoja: no se puede exigir
      if (!String(record[rh] || '').trim()) { toast('Falta llenar: ' + reqs[ri], 'err'); return; }
    }
    var btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = 'Guardando...';
    api('add', { token: state.token, key: state.key, record: record }).then(function () {
      toast('Registro agregado.', 'ok');
      els.forEach(function (i) { i.value = ''; });
      closeAddModal();
      loadArea();
    }).catch(fail).then(function () { btn.disabled = false; btn.textContent = 'Guardar'; });
  }

  function fail(err) { toast((err && err.message) || 'Ocurrió un error.', 'err'); }

  function clearForm() {
    renderForm(); // vacía todo y vuelve a sugerir el número disponible
  }

  // ----- Descargar como PDF (vía diálogo de impresión del navegador) -----
  function downloadPDF() {
    if (!state.headers.length) { toast('No hay datos para descargar.', 'err'); return; }
    var cols = visibleHeaders();
    var rows = sortRows(filteredRows());

    // Encabezado: título, fecha y filtros aplicados
    var d = new Date();
    var meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
                 'septiembre','octubre','noviembre','diciembre'];
    var fechaTxt = d.getDate() + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear();

    var filtrosTxt = '';
    if (filters.length) {
      filtrosTxt = filters.map(function (f) {
        var desc = (f.type === 'values')
          ? f.values.join(', ')
          : ((f.from ? isoToLargo(f.from) : '…') + ' a ' + (f.to ? isoToLargo(f.to) : '…'));
        return String(f.col).trim() + ': ' + desc;
      }).join('  ·  ');
    }
    var busq = document.getElementById('search').value.trim();
    if (busq) filtrosTxt += (filtrosTxt ? '  ·  ' : '') + 'Búsqueda: ' + busq;

    // Tarjetas de resumen (se copian tal cual se ven en pantalla)
    var resumenHtml = '';
    var cards = document.querySelectorAll('#summary .sum-card');
    if (cards.length) {
      resumenHtml = '<div class="pdf-cards">';
      cards.forEach(function (c) {
        var k = c.querySelector('.k'), v = c.querySelector('.v');
        resumenHtml += '<div class="pdf-card"><span class="pk">' +
          esc(k ? k.textContent : '') + '</span><span class="pv">' +
          esc(v ? v.textContent : '') + '</span></div>';
      });
      resumenHtml += '</div>';
    }

    // Tabla
    var thead = '<tr>' + cols.map(function (h) {
      return '<th>' + esc(String(h).trim()) + '</th>';
    }).join('') + '</tr>';

    var tbody = rows.map(function (r) {
      return '<tr>' + cols.map(function (h) {
        var val = r[h];
        if (isDateCol(h)) val = formatDateCell(val);
        else if (isMoneyCol(h)) { var n = parseNumber(val); val = (n === null) ? '' : formatMoney(n); }
        var cls = isMoneyCol(h) ? ' class="r"' : (isCenterCol(h) ? ' class="c"' : '');
        return '<td' + cls + '>' + esc(val) + '</td>';
      }).join('') + '</tr>';
    }).join('');

    var titulo = (state.label || 'Registros');
    var html = '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">' +
      '<title>' + esc(titulo) + ' — ' + esc(fechaTxt) + '</title>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">' +
      '<style>' +
      '@page { size: landscape; margin: 12mm; }' +
      'body { font-family: Jost, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color:#1b2b3d; margin:0; -webkit-print-color-adjust:exact; }' +
      'h1 { font-size:18px; margin:0 0 2px; }' +
      '.sub { font-size:11px; color:#6b7280; margin-bottom:10px; }' +
      '.filtros { font-size:10px; color:#6b7280; margin-bottom:10px; }' +
      '.pdf-cards { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }' +
      '.pdf-card { border:1px solid #e5e7eb; border-radius:6px; padding:6px 10px; min-width:110px; }' +
      '.pdf-card .pk { display:block; font-size:8px; text-transform:uppercase; letter-spacing:.5px; color:#6b7280; }' +
      '.pdf-card .pv { display:block; font-size:13px; font-weight:600; }' +
      'table { width:100%; border-collapse:collapse; font-size:8.5px; table-layout:auto; }' +
      'th, td { border:1px solid #e5e7eb; padding:4px 5px; text-align:left; word-break:break-word; }' +
      'th { background:#f3f4f6; font-weight:600; text-align:center; font-size:8px; text-transform:uppercase; }' +
      'td.r { text-align:right; white-space:nowrap; } td.c { text-align:center; }' +
      'tr { page-break-inside:avoid; } thead { display:table-header-group; }' +
      '.pie { margin-top:10px; font-size:9px; color:#6b7280; }' +
      '</style></head><body>' +
      '<h1>' + esc(titulo) + '</h1>' +
      '<div class="sub">Aplicación de Ideas · ' + esc(fechaTxt) + ' · ' +
        rows.length.toLocaleString('es-MX') + ' registros</div>' +
      (filtrosTxt ? '<div class="filtros">Filtros aplicados — ' + esc(filtrosTxt) + '</div>' : '') +
      resumenHtml +
      '<table><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>' +
      '<div class="pie">Generado desde el panel de Aplicación de Ideas.</div>' +
      '</body></html>';

    var w = window.open('', '_blank');
    if (!w) { toast('Permite las ventanas emergentes para generar el PDF.', 'err'); return; }
    w.document.open(); w.document.write(html); w.document.close();
    w.onload = function () { w.focus(); w.print(); };
    // Respaldo por si onload no dispara
    setTimeout(function () { try { w.focus(); w.print(); } catch (e) {} }, 600);
  }

  // ----- Menú para elegir formato de descarga -----
  function toggleDownloadMenu() {
    var prev = document.getElementById('dlMenu');
    if (prev) { prev.remove(); return; }
    var btn = document.getElementById('downloadBtn');
    var m = document.createElement('div');
    m.className = 'dl-menu'; m.id = 'dlMenu';
    m.innerHTML = '<button type="button" data-f="csv">Descargar CSV</button>' +
                  '<button type="button" data-f="pdf">Descargar PDF</button>';
    btn.parentNode.style.position = 'relative';
    btn.parentNode.appendChild(m);
    m.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        var f = b.getAttribute('data-f');
        m.remove();
        if (f === 'csv') downloadCSV(); else downloadPDF();
      });
    });
    setTimeout(function () {
      document.addEventListener('click', function cerrar(e) {
        if (!m.contains(e.target) && e.target !== btn) { m.remove(); document.removeEventListener('click', cerrar); }
      });
    }, 0);
  }

  function csvEscape(v) {
    v = String(v == null ? '' : v);
    if (/[",\n\r]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }
  function filteredRows() {
    var q = document.getElementById('search').value.trim().toLowerCase();
    var rows = state.rows.filter(passesFilters);
    if (!q) return rows;
    return rows.filter(function (r) {
      return state.headers.some(function (h) {
        return String(r[h] == null ? '' : r[h]).toLowerCase().indexOf(q) !== -1; });
    });
  }
  function downloadCSV() {
    if (!state.headers.length) { toast('No hay datos para descargar.', 'err'); return; }
    var cols = visibleHeaders();
    var rows = sortRows(filteredRows());
    var lines = [ cols.map(function (h) { return csvEscape(String(h).trim()); }).join(',') ];
    rows.forEach(function (r) {
      lines.push(cols.map(function (h) {
        return csvEscape(isDateCol(h) ? formatDateCell(r[h]) : r[h]);
      }).join(','));
    });
    var csv = '\uFEFF' + lines.join('\r\n'); // BOM para que Excel lea acentos
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var fecha = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = (state.label || 'tabla').trim().replace(/\s+/g, '_') + '_' + fecha + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  document.getElementById('togglePass').addEventListener('click', function () {
    var p = document.getElementById('pass');
    var show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    document.getElementById('eyeShow').style.display = show ? 'none' : '';
    document.getElementById('eyeHide').style.display = show ? '' : 'none';
    this.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    p.focus();
  });
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  document.getElementById('logoutBtn2').addEventListener('click', doLogout);
  document.getElementById('menuBtn').addEventListener('click', toggleNav);
  document.getElementById('closeBtn').addEventListener('click', closeNav);
  document.getElementById('backdrop').addEventListener('click', closeNav);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeNav(); });
  document.getElementById('search').addEventListener('input', renderTable);
  document.getElementById('refreshBtn').addEventListener('click', function () {
    if (state.key === 'dashboard') loadDashboard();
    else if (state.key === 'inicio') loadHome();
    else loadArea();
  });
  document.getElementById('downloadBtn').addEventListener('click', toggleDownloadMenu);
  document.getElementById('filterBtn').addEventListener('click', openFilterPopup);
  document.getElementById('filterBar').addEventListener('click', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('x')) {
      filters.splice(parseInt(t.getAttribute('data-i'), 10), 1);
      renderFilterBar(); renderTable();
    } else if (t.id === 'clearFiltersBtn') {
      filters = []; renderFilterBar(); renderTable();
    }
  });
  document.getElementById('tableWrap').addEventListener('click', function (e) {
    var t = e.target;
    var th = t.closest ? t.closest('th.sortable') : null;
    if (th) {
      var col = th.getAttribute('data-col');
      if (sortState.col === col) sortState.dir = -sortState.dir;
      else { sortState.col = col; sortState.dir = 1; }
      editingRow = -1; renderTable(); return;
    }
    if (t.classList && t.classList.contains('edit-btn')) {
      editingRow = parseInt(t.getAttribute('data-row'), 10); renderTable();
    } else if (t.classList && t.classList.contains('cancel-btn')) {
      editingRow = -1; renderTable();
    } else if (t.classList && t.classList.contains('save-btn')) {
      saveEdit(parseInt(t.getAttribute('data-row'), 10), t);
    }
  });
  document.getElementById('tableWrap').addEventListener('change', function (e) {
    var s = e.target;
    if (s.tagName === 'SELECT' && s.classList.contains('row-input') && s.value === '__add__') {
      onSelectChange(s, s.getAttribute('data-col'));
    }
  });
  document.getElementById('saveBtn').addEventListener('click', save);
  document.getElementById('clearBtn').addEventListener('click', clearForm);
  document.getElementById('openAddBtn').addEventListener('click', openAddModal);
  document.getElementById('addModalClose').addEventListener('click', closeAddModal);
  document.getElementById('addModal').addEventListener('click', function (e) {
    if (e.target === this) closeAddModal();   // clic fuera de la tarjeta
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeAddModal();
  });
  document.getElementById('user').focus();
</script>
</body>
</html>
